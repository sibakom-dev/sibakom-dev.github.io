backend:
  name: github
  repo: sibakom-dev/sibakom-dev.github.io
  branch: main

media_folder: "src/assets/images"
public_folder: "/assets/images"

i18n:
  structure: multiple_folders
  locales: [id, en, fr]
  default_locale: id

collections:
  - name: "home"
    label: "Home"
    files:
      - file: "src/id/index.md"
        name: "home_page"
        label: "Home Page"
        i18n: true
        fields:
          - {label: "Layout", name: "layout", widget: "string", default: "layouts/home.njk"}
          - {label: "Title", name: "title", widget: "string", i18n: true}
          - {label: "Description", name: "description", widget: "string", required: false, i18n: true}
          - {label: "Hero Image", name: "heroImage", widget: "image", required: false, i18n: true}
          - {label: "Hero Title", name: "hero_title", widget: "string", required: false, i18n: true}
          - {label: "Hero Subtitle", name: "hero_subtitle", widget: "string", required: false, i18n: true}
          - {label: "Hero Description", name: "hero_description", widget: "text", required: false, i18n: true}
          - {label: "Body", name: "body", widget: "markdown", i18n: true, required: false}

  - name: "about"
    label: "About Us"
    folder: "src/id/about"
    extension: "md"
    create: true
    i18n: true
    nested:
      depth: 4
    meta:
      path: { widget: string, label: 'Path', index_file: 'index' }
    fields:
      - {label: "Layout", name: "layout", widget: "string", default: "layouts/page.njk"}
      - {label: "Title", name: "title", widget: "string", i18n: true}
      - {label: "Body", name: "body", widget: "markdown", i18n: true}

  - name: "services"
    label: "Services & Products"
    folder: "src/id/services"
    extension: "md"
    create: true
    i18n: true
    nested:
      depth: 4
    meta:
      path: { widget: string, label: 'Path', index_file: 'index' }
    fields:
      - {label: "Layout", name: "layout", widget: "string", default: "layouts/page.njk"}
      - {label: "Title", name: "title", widget: "string", i18n: true}
      - {label: "Body", name: "body", widget: "markdown", i18n: true}

  - name: "projects"
    label: "Project Profile"
    folder: "src/id/projects"
    extension: "md"
    create: true
    i18n: true
    nested:
      depth: 4
    meta:
      path: { widget: string, label: 'Path', index_file: 'index' }
    fields:
      - {label: "Layout", name: "layout", widget: "string", default: "layouts/page.njk"}
      - {label: "Title", name: "title", widget: "string", i18n: true}
      - {label: "Body", name: "body", widget: "markdown", i18n: true}

  - name: "contact"
    label: "Contact Us"
    folder: "src/id/contact"
    extension: "md"
    create: true
    i18n: true
    fields:
      - {label: "Layout", name: "layout", widget: "string", default: "layouts/page.njk"}
      - {label: "Title", name: "title", widget: "string", i18n: true}
      - {label: "Body", name: "body", widget: "markdown", i18n: true}
