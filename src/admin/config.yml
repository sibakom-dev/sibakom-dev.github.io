backend:
  name: github
  repo: sibakom-dev/sibakom-dev.github.io
  branch: cms-multilanguage


media_folder: "src/assets/images"
public_folder: "/assets/images"

collections:
  - name: "home"
    label: "Home"
    files:
      - file: "src/id/index.md"
        name: "home_page_id"
        label: "Home Page (ID)"
        fields:
          - {label: "Layout", name: "layout", widget: "string", default: "layouts/home.njk"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "string", required: false}
          - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
          - {label: "Hero Video", name: "heroVideo", widget: "file", required: false, hint: "Upload WebM or MP4"}
          - {label: "Hero Title", name: "hero_title", widget: "string", required: false}
          - {label: "Hero Subtitle", name: "hero_subtitle", widget: "string", required: false}
          - {label: "Hero Description", name: "hero_description", widget: "text", required: false}
          - {label: "Show Call to Action", name: "show_cta", widget: "boolean", default: true, required: false}
          - {label: "CTA Title", name: "cta_title", widget: "string", required: false}
          - {label: "CTA Description", name: "cta_description", widget: "text", required: false}
          - {label: "CTA Button Text", name: "cta_btn_text", widget: "string", required: false}
          - {label: "CTA Button Link", name: "cta_btn_link", widget: "string", required: false}
          - {label: "CTA Background Image", name: "cta_bg", widget: "image", required: false}
          - {label: "Body", name: "body", widget: "markdown", required: false}
          - label: "Zigzag Sections"
            name: "sections"
            widget: "list"
            required: false
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Text Content", name: "text", widget: "markdown"}
              - {label: "Image on Left (Reverse)", name: "reverse", widget: "boolean", default: false, required: false}
          - label: "Solutions Cards"
            name: "solutions_cards"
            widget: "list"
            required: false
            fields:
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Link Text", name: "link_text", widget: "string"}
              - {label: "Link URL", name: "link", widget: "string"}
          - label: "Grid Cards (e.g. Services/Projects)"
