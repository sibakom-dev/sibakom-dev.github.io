backend:
  name: github
  repo: sibakom-dev/sibakom-dev.github.io
  branch: main

# Media paths
media_folder: "assets/images"
public_folder: "/assets/images"

# ==========================================
# 1. Global Internationalization (i18n)
# ==========================================
i18n:
  # Use 'multiple_folders' if files are organized as /[locale]/[collection]/[slug].md
  # Use 'multiple_files' if files are named like [slug].[locale].md
  structure: multiple_folders
  locales:
    - id
    - en
  default_locale: id

# ==========================================
# 2. Collections Configuration
# ==========================================
collections:
  # --- Services & Products ---
  - name: "services"
    label: "Services & Products"
    folder: "src/services"          # Adjust to your base content folder
    path: "{{locale}}/{{slug}}"     # {{locale}} is now recognized as a built-in variable
    create: true
    i18n: true                      # Enables locale switching for this collection
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Publish Date", name: "date", widget: "datetime", i18n: duplicate }
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false, i18n: duplicate }
      - { label: "Description", name: "description", widget: "text", i18n: true }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }

  # --- Projects & Case Studies ---
  - name: "projects"
    label: "Projects & Case Studies"
    folder: "src/projects"
    path: "{{locale}}/{{slug}}"
    create: true
    i18n: true
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Client / Partner", name: "client", widget: "string", i18n: duplicate }
      - { label: "Date", name: "date", widget: "datetime", i18n: duplicate }
      - { label: "Featured Image", name: "image", widget: "image", required: false, i18n: duplicate }
      - { label: "Summary", name: "summary", widget: "text", i18n: true }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }

  # --- Newsroom & Blog ---
  - name: "newsroom"
    label: "Newsroom & Blog"
    folder: "src/newsroom"
    path: "{{locale}}/{{slug}}"
    create: true
    i18n: true
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Publish Date", name: "date", widget: "datetime", i18n: duplicate }
      - { label: "Author", name: "author", widget: "string", i18n: duplicate }
      - { label: "Cover Image", name: "cover", widget: "image", required: false, i18n: duplicate }
      - { label: "Excerpt", name: "excerpt", widget: "text", i18n: true }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }