name: Build and Deploy Eleventy
on:
  push:
    branches:
      - main
      - cms-multilanguage
    paths-ignore:
      - 'docs/**'  # Prevent infinite loop if docs folder is updated
      - '.github/workflows/**' # Prevent loop if workflow updates

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Site
        run: npm run build

      - name: Commit and push docs folder
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Build: Generate Eleventy docs folder [skip ci]"
          file_pattern: 'docs/'
