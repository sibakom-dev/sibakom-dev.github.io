<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Data Gathering page for SIBAKOM.">
    
    
    <meta property="og:title" content="Data Gathering">
    <meta property="og:description" content="Data Gathering page for SIBAKOM.">
    
    <meta property="og:image" content="https://www.sibakom.com/assets/images/pages/corporate-building.jpg">
    
    <meta property="og:type" content="website">

    <title>Data Gathering</title>

    <link rel="icon" type="image/svg+xml" href="/assets/images/Sibakom_Favicon.ico">
    <link rel="stylesheet" href="/assets/css/main.css?v=1.2">
    

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">


    <style>
      :root {
      --font-heading: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      --font-body: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      
      
        --color-primary: #2b5fa7;
        --color-secondary: #5b9bff;
        --color-accent: #6db6ff;
        --color-bg: #f4f8fc;
        --color-surface: #ffffff;
        --color-text: #17304f;
        --color-text-muted: #4e6e96;
        --color-border: #e1ebf5;
        --color-border-hover: #c7dbf0;
      
      
      --header-bg: #c0cbd8ff;
      --header-bg-scrolled: #f4f4f4ff;
      --header-blur: 1px;
      }
    </style>
</head>
<body>
    
        <style>
            .maintenance-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                text-align: center;
                padding: var(--spacing-lg);
                background-color: var(--color-bg);
            }
            .maintenance-icon {
                margin-bottom: var(--spacing-md);
                color: var(--color-primary);
                animation: pulse 2s infinite;
            }
            @keyframes pulse {
                0% { opacity: 1; transform: scale(1); }
                50% { opacity: 0.7; transform: scale(0.95); }
                100% { opacity: 1; transform: scale(1); }
            }
            .maintenance-title {
                font-size: var(--fs-3xl);
                color: var(--color-text);
                margin-bottom: var(--spacing-sm);
                font-family: var(--font-heading);
            }
            .maintenance-desc {
                font-size: var(--fs-lg);
                color: var(--color-text-muted);
                max-width: 600px;
                line-height: var(--lh-relaxed);
                font-family: var(--font-body);
            }
            .maintenance-logo {
                margin-bottom: var(--spacing-xl);
            }
            .maintenance-logo img {
                height: 60px;
                width: auto;
            }
        </style>
        <div class="maintenance-container">
            <div class="maintenance-logo">
                <img src="/assets/images/Sibakom_Logo.png" alt="SIBAKOM Logo">
            </div>
            <div class="maintenance-icon">
                <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            </div>
            <h1 class="maintenance-title">We'll be back soon!</h1>
            <p class="maintenance-desc">We're currently performing scheduled maintenance to improve our services. Our website will be back online shortly. Thank you for your patience.</p>
        </div>
    
</body>
</html>
