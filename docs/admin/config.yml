backend:
  name: github
  repo: sibakom-dev/sibakom-dev.github.io
  branch: main

local_backend:
  url: http://localhost:8082/api/v1

media_folder: "src/assets/images"
public_folder: "/assets/images"

collections:
  - name: "home"
    label: "Home"
    files:
      - file: "src/id/index.md"
        name: "home_page_id"
        label: "Home Page (ID)"
        fields:
          - {label: "Layout", name: "layout", widget: "string", default: "layouts/home.njk"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "string", required: false}
          - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
          - {label: "Hero Title", name: "hero_title", widget: "string", required: false}
          - {label: "Hero Subtitle", name: "hero_subtitle", widget: "string", required: false}
          - {label: "Hero Description", name: "hero_description", widget: "text", required: false}
          - {label: "Body", name: "body", widget: "markdown", required: false}
          - label: "Zigzag Sections"
            name: "sections"
            widget: "list"
            required: false
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Text Content", name: "text", widget: "markdown"}
              - {label: "Image on Left (Reverse)", name: "reverse", widget: "boolean", default: false, required: false}
      - file: "src/en/index.md"
        name: "home_page_en"
        label: "Home Page (EN)"
        fields:
          - {label: "Layout", name: "layout", widget: "string", default: "layouts/home.njk"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "string", required: false}
          - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
          - {label: "Hero Title", name: "hero_title", widget: "string", required: false}
          - {label: "Hero Subtitle", name: "hero_subtitle", widget: "string", required: false}
          - {label: "Hero Description", name: "hero_description", widget: "text", required: false}
          - {label: "Body", name: "body", widget: "markdown", required: false}
          - label: "Zigzag Sections"
            name: "sections"
            widget: "list"
            required: false
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Text Content", name: "text", widget: "markdown"}
              - {label: "Image on Left (Reverse)", name: "reverse", widget: "boolean", default: false, required: false}
      - file: "src/fr/index.md"
        name: "home_page_fr"
        label: "Home Page (FR)"
        fields:
          - {label: "Layout", name: "layout", widget: "string", default: "layouts/home.njk"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "string", required: false}
          - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
          - {label: "Hero Title", name: "hero_title", widget: "string", required: false}
          - {label: "Hero Subtitle", name: "hero_subtitle", widget: "string", required: false}
          - {label: "Hero Description", name: "hero_description", widget: "text", required: false}
          - {label: "Body", name: "body", widget: "markdown", required: false}
          - label: "Zigzag Sections"
            name: "sections"
            widget: "list"
            required: false
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Text Content", name: "text", widget: "markdown"}
              - {label: "Image on Left (Reverse)", name: "reverse", widget: "boolean", default: false, required: false}

  - name: "about_id"
    label: "About Us (ID)"
    folder: "src/id/about"
    extension: "md"
    create: true
    nested: { depth: 4 }
    meta: { path: { widget: string, label: 'Path', index_file: 'index' } }
