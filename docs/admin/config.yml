backend:
  name: github
  repo: sibakom-dev/sibakom-dev.github.io
  branch: cms-multilanguage
media_folder: src/assets/images
public_folder: /assets/images
collections:
- name: pages
  label: Static Pages
  files:
  - file: src/{{locale}}/index.md
    name: home
    label: Home Page
    fields:
    - label: Title
      name: title
      widget: string
      i18n: true
    - label: Hero Image
      name: heroImage
      widget: image
      required: false
      i18n: true
    - label: Hero Video (WebM/MP4)
      name: heroVideo
      widget: file
      required: false
      i18n: true
    - label: Hero Subtitle
      name: hero_subtitle
      widget: string
      required: false
      i18n: true
    - label: Hero Title
      name: hero_title
      widget: string
      required: false
      i18n: true
    - label: Hero Description
      name: hero_description
      widget: text
      required: false
      i18n: true
    - label: Why SIBAKOM Subtitle
      name: why_subtitle
      widget: string
      required: false
      i18n: true
    - label: Why SIBAKOM Title
      name: why_title
      widget: string
      required: false
      i18n: true
    - label: Why SIBAKOM Description
      name: why_description
      widget: text
      required: false
      i18n: true
    - label: Why SIBAKOM Image
      name: why_image
      widget: image
      required: false
      i18n: true
    - label: Why SIBAKOM Points
      name: why_points
      widget: list
      required: false
      i18n: true
      fields:
        - label: Point Text
          name: text
          widget: string
          i18n: true
    - label: Why SIBAKOM Button Text
      name: why_btn_text
      widget: string
      required: false
      i18n: true
    - label: Why SIBAKOM Button Link
      name: why_btn_link
      widget: string
      required: false
      i18n: true
    - label: Zigzag Subtitle
      name: zigzag_subtitle
      widget: string
      required: false
      i18n: true
    - label: Zigzag Title
      name: zigzag_title
      widget: string
      required: false
      i18n: true
    - label: Custom Content Sections
      name: sections
      widget: list
      required: false
      i18n: true
      fields:
        - label: Section Title
          name: title
          widget: string
          i18n: true
        - label: Section Image
          name: image
          widget: image
          required: false
          i18n: true
        - label: Section Text (Markdown supported)
          name: text
          widget: markdown
          i18n: true
        - label: Section Link URL (Optional)
          name: link
          widget: string
          required: false
          i18n: true
        - label: Section Link Text (Optional)
          name: link_text
          widget: string
          required: false
          i18n: true
    - label: Body
      name: body
      widget: markdown
      required: false
      i18n: true
    i18n: true
  - file: src/{{locale}}/about/index.md
    name: about
    label: About Us
    fields:
    - label: Title
      name: title
      widget: string
      i18n: true
    - label: Hero Image
      name: heroImage
      widget: image
      required: false
      i18n: true
    - label: Body
      name: body
      widget: markdown
      required: false
      i18n: true
    i18n: true
  - file: src/{{locale}}/about/specialization.md
    name: about_specialization
    label: Specialization
    fields:
    - label: Title
      name: title
      widget: string
      i18n: true
    - label: Hero Image
      name: heroImage
      widget: image
      required: false
      i18n: true
    - label: Body
      name: body
      widget: markdown
      required: false
      i18n: true
    i18n: true
  - file: src/{{locale}}/about/strategic-partners.md
    name: about_strategic_partners
    label: Strategic Partner
    fields:
    - label: Title
      name: title
      widget: string
      i18n: true
    - label: Hero Image
      name: heroImage
      widget: image
      required: false
      i18n: true
    - label: Body
      name: body
      widget: markdown
      required: false
      i18n: true
    i18n: true
  - file: src/{{locale}}/services/index.md
    name: services_index
    label: Services & Products
    fields:
    - label: Title
      name: title
      widget: string
      i18n: true
    - label: Hero Image
      name: heroImage
      widget: image
      required: false
      i18n: true
    - label: Body
      name: body
      widget: markdown
      required: false
      i18n: true
    i18n: true
  - file: src/{{locale}}/projects/index.md
    name: projects_index
    label: Project Profile
    fields:
    - label: Title
      name: title
      widget: string
      i18n: true
    - label: Hero Image
      name: heroImage
      widget: image
      required: false
      i18n: true
    - label: Body
      name: body
      widget: markdown
      required: false
      i18n: true
    i18n: true
  - file: src/{{locale}}/newsroom/index.md
    name: newsroom_index
    label: Newsroom
    fields:
    - label: Title
      name: title
      widget: string
      i18n: true
    - label: Hero Image
      name: heroImage
      widget: image
      required: false
      i18n: true
    - label: Body
      name: body
      widget: markdown
      required: false
      i18n: true
    i18n: true
  - file: src/{{locale}}/contact/index.md
    name: contact
    label: Contact Us
    fields:
    - label: Title
      name: title
      widget: string
      i18n: true
    - label: Hero Image
      name: heroImage
      widget: image
      required: false
      i18n: true
    - label: Body
      name: body
      widget: markdown
      required: false
      i18n: true
    i18n: true
  i18n: true
- name: services
  label: Services & Products
  folder: src
  filter:
    field: layout
    value: layouts/service.njk
  create: true
  extension: md
  format: frontmatter
  fields:
  - label: Layout
    name: layout
    widget: hidden
    default: layouts/service.njk
    i18n: duplicate
  - label: Path
    name: path
    widget: string
    required: false
    i18n: duplicate
  - label: Title
    name: title
    widget: string
    i18n: true
  - label: Description
    name: description
    widget: string
    required: false
    i18n: duplicate
  - label: Thumbnail Image
    name: image
    widget: image
    required: false
    i18n: true
  - label: Hero Image (Wide)
    name: heroImage
    widget: image
    required: false
    i18n: true
  - label: Body
    name: body
    widget: markdown
    required: false
    i18n: true
  i18n: true
  path: '{{locale}}/services/{{slug}}'
- name: projects
  label: Projects & Case Studies
  folder: src
  filter:
    field: layout
    value: layouts/project.njk
  create: true
  extension: md
  format: frontmatter
  fields:
  - label: Layout
    name: layout
    widget: hidden
    default: layouts/project.njk
    i18n: duplicate
  - label: Path
    name: path
    widget: string
    required: false
    i18n: duplicate
  - label: Client
    name: client
    widget: string
    required: false
    i18n: duplicate
  - label: Location
    name: location
    widget: string
    required: false
    i18n: duplicate
  - label: Technology
    name: technology
    widget: string
    required: false
    i18n: duplicate
  - label: Title
    name: title
    widget: string
    i18n: true
  - label: Description
    name: description
    widget: string
    required: false
    i18n: duplicate
  - label: Tag
    name: tag
    widget: string
    required: false
    i18n: duplicate
  - label: Thumbnail Image
    name: image
    widget: image
    required: false
    i18n: true
  - label: Hero Image (Wide)
    name: heroImage
    widget: image
    required: false
    i18n: true
  - label: Body
    name: body
    widget: markdown
    required: false
    i18n: true
  i18n: true
  path: '{{locale}}/projects/{{slug}}'
- name: newsroom
  label: Newsroom & Blog
  folder: src
  filter:
    field: layout
    value: layouts/post.njk
  create: true
  extension: md
  format: frontmatter
  fields:
  - label: Layout
    name: layout
    widget: hidden
    default: layouts/post.njk
    i18n: duplicate
  - label: Title
    name: title
    widget: string
    i18n: true
  - label: Writer
    name: writer
    widget: string
    required: false
    i18n: duplicate
  - label: Date
    name: date
    widget: datetime
    required: false
    i18n: true
  - label: Read Time
    name: read_time
    widget: string
    required: false
    i18n: duplicate
  - label: Topic
    name: topic
    widget: string
    required: false
    i18n: duplicate
  - label: Tags
    name: tags
    widget: list
    required: false
    i18n: true
  - label: Thumbnail Image
    name: image
    widget: image
    required: false
    i18n: true
  - label: Hero Image (Wide)
    name: heroImage
    widget: image
    required: false
    i18n: true
  - label: Description
    name: description
    widget: string
    required: false
    i18n: duplicate
  - label: Body
    name: body
    widget: markdown
    required: false
    i18n: true
  i18n: true
  path: '{{locale}}/newsroom/{{slug}}'
i18n:
  structure: multiple_folders
  locales:
  - en
  - id
  - fr
  default_locale: en
